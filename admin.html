<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin ZulfaSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
<style>body{background:#FBFAFF}#app{display:flex;min-height:100vh}aside{width:230px;background:var(--ink);padding:20px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}aside b{color:#fff;font-size:20px;padding:0 10px 14px}aside button,aside a{background:none;border:0;color:#cfcbe8;text-align:left;padding:10px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}aside button:hover,aside a:hover{background:#ffffff14}aside button.on{background:var(--p);color:#fff}
#main{flex:1;padding:28px;min-width:0}.box{align-self:flex-start;width:min(420px,92%);max-width:420px;margin:12vh auto;background:#fff;padding:32px;border-radius:16px;text-align:center;box-shadow:0 12px 32px -4px rgba(124,92,240,.12)}#gb{display:flex;justify-content:center;margin:20px 0}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}.kp .card b{display:block;font-size:34px;color:var(--p);font-weight:800}.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}svg{width:100%}
.br{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:14px;margin:8px 0}.br div{height:8px;background:var(--lav);border-radius:9px}.br i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--b));border-radius:9px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{color:var(--ink);font-size:12px;letter-spacing:.05em}
.sm{padding:6px 14px!important;font-size:13px!important}.md{position:fixed;inset:0;background:#1E1B3A99;display:grid;place-items:center;z-index:100;padding:16px}.md form{background:#fff;border-radius:16px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}.f label{display:block;font-weight:600;color:var(--ink);font-size:14px;margin:10px 0}.f input:not([type=checkbox]),.f textarea,.f select{width:100%;margin-top:4px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit}
#toast{position:fixed;top:16px;right:16px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:200}#toast.show{opacity:1}#toast.er{background:#ba1a1a}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:static}aside b{display:none}.kp,.g2{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}@media print{aside,.noprint,#toast{display:none!important}}</style></head>
<body><div id="app"></div><div id="toast"></div><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
