<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="img/favicon.svg"><script>try{document.documentElement.dataset.theme=localStorage.getItem("zs_th")||"light"}catch(e){}</script><title>Admin ZulfaSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
<style>body{background:var(--bg)}#app{display:flex;min-height:100vh}
aside{width:244px;background:linear-gradient(180deg,#1E1B3A,#2b2470 70%,#3a2f8f);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}aside b{color:#fff;font-size:20px;padding:0 12px 18px}
aside button,aside a{background:none;border:0;color:#cfcbe8;text-align:left;padding:11px 14px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.25s}aside button:hover,aside a:hover{background:#ffffff18;color:#fff;transform:translateX(4px)}aside button.on{background:linear-gradient(100deg,var(--p),#9b7dff);color:#fff;box-shadow:0 8px 22px -6px rgba(124,92,240,.8)}aside #thm{margin-top:auto}
#main{flex:1;padding:32px;min-width:0;max-width:1300px}#main>*{animation:up .5s both}#main>*:nth-child(2){animation-delay:.07s}#main>*:nth-child(3){animation-delay:.14s}#main>*:nth-child(4){animation-delay:.21s}@keyframes up{from{opacity:0;transform:translateY(14px)}}
#main h2{font-size:30px;margin:0 0 6px;background:linear-gradient(100deg,var(--ink),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.box{align-self:flex-start;width:min(420px,92%);margin:12vh auto;background:var(--card);padding:32px;border-radius:20px;text-align:center;box-shadow:0 20px 50px -10px rgba(124,92,240,.25)}#gb{display:flex;justify-content:center;margin:20px 0}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}.kp .card{position:relative;overflow:hidden}.kp .card::after{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--p),var(--b),var(--o))}.kp .card b{display:block;font-size:36px;font-weight:800;background:linear-gradient(100deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}svg{width:100%}.br{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:14px;margin:8px 0}.br div{height:8px;background:var(--lav);border-radius:9px}.br i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--b));border-radius:9px}
.tw{overflow-x:auto;border-radius:16px}table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bd);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{color:var(--ink);font-size:12px;letter-spacing:.05em}tr:hover td{background:var(--lav)}
.sm{padding:6px 14px!important;font-size:13px!important}.md{position:fixed;inset:0;background:#1E1B3A99;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:16px}.md form{background:var(--card);border-radius:20px;padding:26px;width:min(580px,100%);max-height:90vh;overflow:auto;animation:up .3s both}
.f label{display:block;font-weight:600;color:var(--ink);font-size:14px;margin:10px 0}.f input:not([type=checkbox]),.f textarea,.f select{width:100%;margin-top:4px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.dz{border:2px dashed var(--p);border-radius:20px;padding:34px;text-align:center;background:var(--card);cursor:pointer;margin:0 0 16px;transition:.25s;display:grid;gap:6px}.dz b{color:var(--ink);font-size:18px}.dz:hover,.dz.ov{background:var(--lav);transform:scale(1.01);box-shadow:0 0 0 6px rgba(124,92,240,.12)}
.up{display:grid;grid-template-columns:1fr 160px 40px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px}.up span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}.pg{height:8px;border-radius:9px;background:var(--lav);overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--o));transition:width .2s}.up.er{border-color:#ba1a1a}.up.f{grid-template-columns:1fr auto auto}.att{margin-top:14px;padding-top:6px;border-top:1px solid var(--bd)}.att small{display:block;margin:4px 0 10px}.att .dz{padding:18px;margin:0 0 10px}
#toast{position:fixed;top:16px;right:16px;background:#1E1B3A;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transform:translateY(-10px);transition:.3s;z-index:200}#toast.show{opacity:1;transform:none}#toast.er{background:#ba1a1a}
@media(max-width:800px){#app{flex-direction:column}aside{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:static}aside b{display:none}aside #thm{margin-top:0}.kp{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}#main{padding:18px}}@media print{aside,.noprint,#toast{display:none!important}}</style></head>
<body><div id="app"></div><div id="toast"></div><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
